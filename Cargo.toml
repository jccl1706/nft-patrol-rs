[package]
name = "nft-patrol"
version = "0.1.0"
edition = "2024"
description = "nftables firewall dashboard for Arch Linux: rules in plain words, exposed ports, blocked traffic"
license = "GPL-3.0-or-later"
repository = "https://github.com/jccl1706/nft-patrol-rs"
readme = "README.md"
keywords = ["nftables", "firewall", "arch-linux", "tui", "ratatui"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.1.8"
unicode-width = "0.2.2"
